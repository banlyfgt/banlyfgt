<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="banlyfgt — builder, tinkerer, learner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="900" height="260" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- drifting glow blobs -->
    <circle cx="140" cy="60" r="90" fill="#38bdf8" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="140;260;140" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="210" r="100" fill="#c084fc" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="760;640;760" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- dot grid -->
    <g fill="#ffffff" opacity="0.08">
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2"/>
      </pattern>
      <rect width="900" height="260" fill="url(#dots)"/>
    </g>

    <!-- window dots -->
    <circle cx="36" cy="34" r="6" fill="#f87171"/>
    <circle cx="58" cy="34" r="6" fill="#fbbf24"/>
    <circle cx="80" cy="34" r="6" fill="#4ade80"/>

    <!-- content -->
    <text x="60" y="130" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="20" fill="#94a3b8">~ $ whoami</text>
    <text x="60" y="185" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#accent)">banlyfgt</text>
    <rect x="60" y="205" width="0" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" from="0" to="180" dur="1.4s" fill="freeze" begin="0.3s"/>
    </rect>
    <text x="60" y="236" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="18" fill="#e2e8f0">builder · tinkerer · lifelong learner
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze"/>
    </text>
    <rect x="472" y="219" width="10" height="22" fill="#38bdf8" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1.1s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
